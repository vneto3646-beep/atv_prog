[project]
name = "ifc-festa-blumenau"
version = "0.1.0"
description = "Sistema de gestão da festa do IFC Campus Blumenau"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37.0",
    "SQLAlchemy>=2.0.0",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
